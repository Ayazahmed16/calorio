{# Shared motion system: curtain page transition, top progress bar, toasts, button loading, link underlines #}
<style>
    :root { --ease:cubic-bezier(.16,1,.3,1); }
    html { scroll-behavior:smooth; scroll-padding-top:88px; }

    /* Top progress bar */
    #topbar { position:fixed; top:0; left:0; right:0; height:2px; z-index:10000; pointer-events:none; background:#a5f3fc;
              box-shadow:0 0 10px #06b6d4; transform:scaleX(0); transform-origin:left; opacity:0; will-change:transform; }

    /* Link underline that grows from the left */
    .ulink { position:relative; }
    .ulink::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:1px; background:#06b6d4;
                    transform:scaleX(0); transform-origin:left; transition:transform .45s var(--ease); }
    .ulink:hover::after, .ulink.active::after { transform:scaleX(1); }

    /* Toasts */
    #toasts { position:fixed; right:20px; bottom:20px; z-index:10001; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
    .toast { position:relative; overflow:hidden; min-width:240px; max-width:340px; padding:14px 18px 16px; background:#0f1d20; color:#e6f4f5;
             border:1px solid rgba(6,182,212,.45); border-left:3px solid #06b6d4; border-radius:4px; box-shadow:0 16px 40px rgba(0,0,0,.5);
             font:500 13px 'Inter',sans-serif; transform:translateX(120%); opacity:0; transition:transform .6s var(--ease), opacity .6s var(--ease); }
    .toast.show { transform:none; opacity:1; }
    .toast.error { border-left-color:#ef4444; }
    .toast i { position:absolute; left:0; bottom:0; height:2px; width:100%; background:#06b6d4; transform-origin:left; animation:toast-bar 4s linear forwards; }
    @keyframes toast-bar { to { transform:scaleX(0); } }

    /* Button loading state */
    button.is-loading { pointer-events:none; opacity:.85; }
    button.is-loading::before { content:""; display:inline-block; width:14px; height:14px; margin-right:10px; vertical-align:-2px;
                                border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Error shake */
    @keyframes shake { 10%,90% { transform:translateX(-2px); } 20%,80% { transform:translateX(4px); } 30%,50%,70% { transform:translateX(-7px); } 40%,60% { transform:translateX(7px); } }
    .shake { animation:shake .6s cubic-bezier(.36,.07,.19,.97) both; }

    @media (prefers-reduced-motion: reduce) { #topbar, .toast, .ulink::after { animation:none !important; transition:none !important; } }
</style>
<div id="topbar"></div>
<div id="toasts">
    {% for m in messages %}<div class="toast {{ m.tags }}" data-toast>{{ m }}<i></i></div>{% endfor %}
</div>
<script>
    (function () {
        const bar = document.getElementById('topbar');
        function startBar() {
            bar.style.transition = 'none'; bar.style.opacity = '1'; bar.style.transform = 'scaleX(0)'; bar.getBoundingClientRect();
            bar.style.transition = 'transform 1.4s cubic-bezier(.16,1,.3,1)'; bar.style.transform = 'scaleX(.75)';
        }
        function finishBar() {
            bar.style.transition = 'transform .4s ease, opacity .5s ease .35s'; bar.style.transform = 'scaleX(1)'; bar.style.opacity = '0';
        }
        document.addEventListener('submit', function (e) {
            const f = e.target; startBar();
            const b = f.querySelector('button[type=submit],button:not([type])');
            if (b && !b.classList.contains('is-loading')) setTimeout(() => b.classList.add('is-loading'), 0);
        });
        window.addEventListener('load', finishBar);
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) { finishBar();
                document.querySelectorAll('button.is-loading').forEach(b => b.classList.remove('is-loading')); }
        });
        // toasts
        document.querySelectorAll('[data-toast]').forEach(function (t, i) {
            setTimeout(() => t.classList.add('show'), 500 + i * 150);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 700); }, 4500 + i * 150);
        });
        // shake a card containing a form error
        const err = document.querySelector('.errorlist');
        if (err) { const card = err.closest('form'); const t = card && card.parentElement; if (t) t.classList.add('shake'); }
    })();
</script>
